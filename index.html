<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plattenteller</title>
<meta name="description" content="Glücksrad für DJ-Treffen: Namen eintragen, drehen, jeder landet zufällig in seinem Stunden-Slot.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#050706" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EDF2EF" media="(prefers-color-scheme: light)">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23050706'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2329F07C' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%2329F07C'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- Zum Home-Bildschirm: eigenes Symbol, eigener Name, ohne Browser-Leisten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plattenteller">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* Dunkel - Standardbild */
    --ink:#050706;
    --panel:#0C100D;
    --panel-2:#131A15;
    --line:#25302A;
    --line-soft:#1A231D;
    --text:#E9F2EC;
    --muted:#7F9187;
    --faint:#5C6B62;
    --green:#29F07C;
    --green-hover:#57F79A;
    --on-green:#04170C;
    --glow:rgba(41,240,124,.10);
    --bg-top:#0D1A12;
    --bar-a:#0E140F;
    --bar-b:#080B09;
    --row-open:#0A0F0B;
    --row-fresh:#122B1B;
    --shadow:rgba(0,0,0,.85);
    --alert:#FF6B3D;
    --alert-bg:rgba(255,107,61,.09);
    --alert-bg-hover:rgba(255,107,61,.16);
    --on-alert:#1A0A05;

    /* Eine Schrift fuer alles - Ziffern laufen dank tabular-nums trotzdem in Spalten */
    --display:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;

    --r:3px;
  }

  /* Hell - per Schalter oder wenn das Geraet auf hell steht */
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --ink:#EDF2EF;
      --panel:#F8FBF9;
      --panel-2:#FFFFFF;
      --line:#D3DFD8;
      --line-soft:#E4ECE7;
      --text:#0A1410;
      --muted:#5B6E64;
      --faint:#93A399;
      --green:#0C9A4E;
      --green-hover:#0A8543;
      --on-green:#FFFFFF;
      --glow:rgba(12,154,78,.09);
      --bg-top:#E4EFE9;
      --bar-a:#FFFFFF;
      --bar-b:#F2F6F3;
      --row-open:#FAFCFB;
      --row-fresh:#E4F5EB;
      --shadow:rgba(10,30,20,.28);
      --alert:#D9451F;
      --alert-bg:rgba(217,69,31,.08);
      --alert-bg-hover:rgba(217,69,31,.15);
      --on-alert:#FFFFFF;
    }
  }
  :root[data-theme="light"]{
    --ink:#EDF2EF;
    --panel:#F8FBF9;
    --panel-2:#FFFFFF;
    --line:#D3DFD8;
    --line-soft:#E4ECE7;
    --text:#0A1410;
    --muted:#5B6E64;
    --faint:#93A399;
    --green:#0C9A4E;
    --green-hover:#0A8543;
    --on-green:#FFFFFF;
    --glow:rgba(12,154,78,.09);
    --bg-top:#E4EFE9;
    --bar-a:#FFFFFF;
    --bar-b:#F2F6F3;
    --row-open:#FAFCFB;
    --row-fresh:#E4F5EB;
    --shadow:rgba(10,30,20,.28);
    --alert:#D9451F;
    --alert-bg:rgba(217,69,31,.08);
    --alert-bg-hover:rgba(217,69,31,.15);
    --on-alert:#FFFFFF;
  }
  :root[data-theme="dark"]{
    --ink:#050706;
    --panel:#0C100D;
    --panel-2:#131A15;
    --line:#25302A;
    --line-soft:#1A231D;
    --text:#E9F2EC;
    --muted:#7F9187;
    --faint:#5C6B62;
    --green:#29F07C;
    --green-hover:#57F79A;
    --on-green:#04170C;
    --glow:rgba(41,240,124,.10);
    --bg-top:#0D1A12;
    --bar-a:#0E140F;
    --bar-b:#080B09;
    --row-open:#0A0F0B;
    --row-fresh:#122B1B;
    --shadow:rgba(0,0,0,.85);
    --alert:#FF6B3D;
    --alert-bg:rgba(255,107,61,.09);
    --alert-bg-hover:rgba(255,107,61,.16);
    --on-alert:#1A0A05;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}

  body{
    display:flex;flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(900px 520px at 50% -8%, var(--bg-top) 0%, transparent 62%),
      var(--ink);
    color:var(--text);
    font-family:var(--body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2{margin:0;text-wrap:balance}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .label{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);
  }

  /* ---------- Kopfleiste ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--bar-a) 0%, var(--bar-b) 100%);
  }
  .brand{
    font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:.02em;
    text-transform:uppercase;line-height:1;
  }
  .brand span{color:var(--green)}
  .topbar .spacer{flex:1 1 30px}

  .iconbtn{
    background:none;border:1px solid var(--line);border-radius:var(--r);
    width:36px;height:34px;display:grid;place-items:center;color:var(--muted);flex:none;
  }
  .iconbtn:hover{color:var(--green);border-color:var(--green)}
  .iconbtn svg{width:17px;height:17px;display:block}
  .iconbtn[data-mode="dark"] .ic-moon{display:none}
  .iconbtn[data-mode="light"] .ic-sun{display:none}

  .ghost{
    background:none;border:1px solid var(--line);border-radius:var(--r);
    padding:7px 10px;color:var(--muted);
    font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;
    text-transform:uppercase;
  }
  .ghost:hover{color:var(--text);border-color:var(--muted)}

  .topactions{display:flex;align-items:center;gap:8px}

  /* ---------- Rundgang ---------- */
  .tour{position:fixed;inset:0;z-index:60}
  .tour-spot{
    position:absolute;border-radius:4px;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.76), 0 0 0 2px var(--green);
  }
  .tour-arrow{position:absolute;width:0;height:0;transform:translateX(-50%)}
  .tour-arrow.up{
    top:-9px;border-left:9px solid transparent;border-right:9px solid transparent;
    border-bottom:9px solid var(--panel-2);
  }
  .tour-arrow.down{
    bottom:-9px;border-left:9px solid transparent;border-right:9px solid transparent;
    border-top:9px solid var(--panel-2);
  }
  .tour-close{
    position:absolute;top:4px;right:4px;
    background:none;border:none;color:var(--faint);
    width:38px;height:38px;font-size:20px;line-height:1;
  }
  .tour-close:hover{color:var(--text)}
  .tour-card{
    position:absolute;width:min(310px,calc(100vw - 24px));
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px 12px;
    box-shadow:0 24px 60px -26px rgba(0,0,0,.9);
  }
  .tour-card .step{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--green);margin:0 0 5px;
  }
  .tour-card h3{
    margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:16px;
    letter-spacing:.04em;text-transform:uppercase;
  }
  .tour-card p.text{margin:0;color:var(--text);font-size:14px;line-height:1.5}
  .tour-actions{display:flex;align-items:center;gap:8px;margin-top:12px}
  .tour-actions .ghost{padding:11px 12px;min-height:44px}
  .tour-actions .grow{flex:1 1 auto}
  .tour-next{
    background:var(--green);color:var(--on-green);border:none;border-radius:var(--r);
    padding:11px 20px;min-height:44px;font-weight:600;font-size:15px;
  }
  .tour-next:hover{background:var(--green-hover)}

  /* ---------- Reglerleiste (eingeklappt) ---------- */
  .bar{grid-area:bar;display:flex;flex-direction:column;background:var(--panel)}
  .barsum{
    display:flex;align-items:center;gap:12px;width:100%;
    background:var(--alert-bg);border:none;
    padding:9px 20px;text-align:left;
  }
  .barsum:hover{background:var(--alert-bg-hover)}
  .barsum .gear{
    display:grid;place-items:center;flex:none;
    width:28px;height:28px;border-radius:2px;
    background:var(--alert);color:var(--on-alert);
  }
  .barsum .gear svg{width:17px;height:17px;display:block}
  .barsum .what{
    flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--alert);
  }
  .barsum .sum{
    flex:1 1 auto;min-width:0;
    font-family:var(--mono);font-size:12.5px;color:var(--text);
    font-variant-numeric:tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .barsum .caret{
    flex:none;display:grid;place-items:center;color:var(--alert);
    transition:transform .18s ease;
  }
  .barsum .caret svg{width:18px;height:18px;display:block}
  .barsum[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .ctls{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px 26px;
    padding:8px 22px 12px;
    background:var(--alert-bg);
  }
  .ctl{display:flex;align-items:center;gap:9px}
  .ctl input[type="time"],.ctl select{
    background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
    padding:6px 8px;font-family:var(--mono);font-size:13px;
    font-variant-numeric:tabular-nums;
  }
  .stepper{display:flex;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:var(--r)}
  .stepper button{
    background:none;border:none;color:var(--text);
    width:30px;height:30px;font-size:17px;line-height:1;display:grid;place-items:center;
  }
  .stepper button:hover:not(:disabled){color:var(--green)}
  .stepper button:disabled{color:var(--faint);cursor:not-allowed}
  .stepper .val{
    font-family:var(--mono);font-size:13px;min-width:26px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .until{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .toggle{display:flex;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
  .toggle button{
    background:var(--panel-2);border:none;padding:6px 11px;
    font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);
  }
  .toggle button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}

  /* ---------- Bühne ---------- */
  .stage{
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:270px minmax(0,1fr) 310px;
    grid-template-areas:"bar bar bar" "crew deck plan";
    grid-template-rows:auto minmax(0,1fr);
    gap:1px;
    background:var(--line);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    align-items:stretch;
  }
  .col{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .col--crew{grid-area:crew}
  .col--plan{grid-area:plan}
  .col--deck{
    grid-area:deck;
    background:
      radial-gradient(520px 400px at 50% 42%, var(--glow) 0%, transparent 70%),
      var(--panel);
    align-items:center;justify-content:center;
    padding:16px 16px 20px;
  }

  .col h2{
    font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text);
  }
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .count{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- Crew ---------- */
  .add{display:flex;gap:8px}
  .add input{
    flex:1 1 auto;min-width:0;
    background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 10px;
  }
  .add input::placeholder{color:var(--faint)}
  .add button{
    background:var(--green);color:var(--on-green);border:none;border-radius:var(--r);
    padding:0 14px;font-weight:600;
  }
  .add button:hover{background:var(--green-hover)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;max-height:min(260px,32vh);overflow:auto;overscroll-behavior:contain}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:2px;
    padding:5px 5px 5px 9px;font-weight:500;max-width:100%;
  }
  .chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex:none}
  .chip.is-placed{color:var(--muted)}
  .chip .x{
    background:none;border:none;color:var(--faint);line-height:1;padding:0 3px;font-size:15px;flex:none;
  }
  .chip .x:hover{color:var(--green)}
  .empty{color:var(--muted);font-size:13px}
  .note{color:var(--muted);font-size:12px;margin:0}

  /* ---------- Rad ---------- */
  .wheelwrap{position:relative;width:100%;max-width:470px;aspect-ratio:1}
  canvas{
    width:100%;height:100%;display:block;border-radius:50%;
    box-shadow:0 0 0 1px var(--line), 0 24px 54px -34px var(--shadow);
  }
  .needle{
    position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    width:0;height:0;
    border-left:12px solid transparent;border-right:12px solid transparent;
    border-top:28px solid var(--green);
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));
  }
  .spin{
    margin-top:20px;
    background:var(--green);color:var(--on-green);
    border:none;border-radius:var(--r);
    padding:14px 40px;
    font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;
  }
  .spin:hover:not(:disabled){background:var(--green-hover)}
  .spin:disabled{background:var(--panel-2);color:var(--faint);border:1px solid var(--line);cursor:not-allowed}
  .allbtn{
    margin-top:10px;background:none;
    border:1px solid var(--line);border-radius:var(--r);
    color:var(--muted);padding:9px 18px;min-height:40px;
    font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  }
  .allbtn:hover:not(:disabled){color:var(--green);border-color:var(--green)}
  .allbtn:disabled{color:var(--faint);cursor:not-allowed}

  .readout{
    margin-top:12px;text-align:center;min-height:50px;
    display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;
  }
  .readout .who{
    font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;
    text-transform:uppercase;color:var(--green);line-height:1.1;
  }
  .readout .where{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
  .readout.is-idle .who{color:var(--muted);font-size:16px;letter-spacing:.14em}

  /* ---------- Laufplan ---------- */
  .slots{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:1px;
    background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r);
    flex:0 1 auto;min-height:0;max-height:min(74vh,760px);
    overflow:auto;overscroll-behavior:contain;
    align-content:flex-start;
  }
  .slots li{display:flex;align-items:center;gap:10px;background:var(--panel-2);padding:6px 10px}
  .slots li.is-filled{cursor:pointer}
  .slots li.is-picked{outline:2px solid var(--green);outline-offset:-2px}
  .slots li.is-open{background:var(--row-open)}
  .slots li.is-next .time,.slots li.is-next .dj{color:var(--green)}
  .slots li.is-fresh{background:var(--row-fresh);animation:rowpulse 1.4s ease-out 1}
  @keyframes rowpulse{
    from{background:color-mix(in srgb, var(--green) 38%, var(--panel-2))}
    to{background:var(--row-fresh)}
  }
  .slots .time{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .slots .daytag{
    font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--green);flex:none;
    border:1px solid color-mix(in srgb, var(--green) 45%, transparent);border-radius:2px;padding:0 3px;
  }
  .slots li:not(.is-open) .time{color:var(--text)}
  .slots .dj{flex:1 1 auto;min-width:0;font-weight:600;text-align:right;overflow-wrap:anywhere;line-height:1.25}
  .slots .rel{
    background:none;border:none;color:var(--faint);flex:none;
    font-size:16px;line-height:1;padding:2px 4px;margin-right:-4px;
  }
  .slots .rel:hover{color:var(--green)}
  .slots li.is-open .dj{color:var(--faint);font-weight:400;font-style:italic}
  .planfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;
    display:flex;align-items:center;gap:16px;max-width:calc(100vw - 24px);
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 16px;font-size:13px;
    box-shadow:0 18px 40px -22px var(--shadow);
  }
  .toast button{
    background:none;border:none;padding:6px 0;
    color:var(--green);font-weight:600;font-size:13px;white-space:nowrap;
  }

  /* ---------- Treffer-Moment ueber dem Rad ---------- */
  .reveal{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
  .reveal-box{
    background:color-mix(in srgb, var(--ink) 90%, transparent);
    border:1px solid var(--green);border-radius:6px;padding:14px 24px;
    animation:revealin .32s cubic-bezier(.2,.9,.3,1.15) both;
  }
  .reveal.is-out .reveal-box{animation:revealout .28s ease-in both}
  .reveal-name{
    font-weight:700;font-size:clamp(22px,7vw,34px);text-transform:uppercase;
    color:var(--green);line-height:1.05;letter-spacing:.02em;overflow-wrap:anywhere;
  }
  .reveal-slot{font-size:14px;color:var(--text);margin-top:5px;font-variant-numeric:tabular-nums}
  @keyframes revealin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  @keyframes revealout{to{opacity:0;transform:scale(.96)}}

  button.count{background:none;border:none;padding:0;cursor:pointer}
  button.count:hover{color:var(--text)}
  .note button{
    background:none;border:none;padding:0;color:var(--green);
    font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer;
  }

  /* ---------- Fusszeile ---------- */
  .foot{
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    text-align:center;font-size:12px;color:var(--faint);
  }
  .foot a{color:var(--muted);text-decoration:none}
  .foot a:hover{color:var(--green)}

  /* ---------- Handy: Crew oben quer, darunter Rad + Laufplan ---------- */
  @media (max-width:1000px){
    .stage{
      grid-template-columns:minmax(0,1.5fr) minmax(148px,1fr);
      grid-template-areas:"bar bar" "crew crew" "deck plan";
      grid-template-rows:auto auto minmax(0,1fr);
    }
    .barsum{padding:8px 13px;gap:9px}
    .ctls{padding:8px 13px 10px;gap:9px 18px}
    .col{padding:12px 13px}
    .col--deck{padding:16px 12px 20px}
    .chips{max-height:104px}
    .slots{max-height:none}
    /* unter 16px zoomt iOS beim Hineintippen automatisch rein */
    .add input,.ctl input[type="time"],.ctl select{font-size:16px}
    .wheelwrap{max-width:100%}
  }
  @media (max-width:640px){

<script>

        { fill: "#8AD3A8", ink: "#0A1410" },
        { fill: "#3EAC71", ink: "#FFFFFF" },
        { fill: "#0C9A4E", ink: "#FFFFFF" }
      ],
      win: { fill: "#0A1410", ink: "#FFFFFF" },
      accent: "#0C9A4E",
      base: "#FFFFFF",
      seam: "rgba(10,20,16,.14)",
      hubFill: "#FFFFFF",
      hubText: "#0A1410",
      hubLabel: "#5B6E64",
      quiet: "#5B6E64",
      ring: "#D3DFD8"
    }
  };

  var TOUR_KEY = "plattenteller.tour";
  var SOUND_KEY = "plattenteller.sound";
  var CREW_FOLD_AT = 10;         /* ab so vielen Namen klappt die Crew zu */
  var REVEAL_MS = 2000;

  /* Der Rundgang zeigt auf echte Bedienelemente, nichts wird nachgebaut. */
  var TOUR = [
    {
      sel: ".add",
      title: "Namen rein",
      text: "Tipp die DJ-Namen ein. Mehrere auf einmal gehen auch: mit Komma trennen oder eine fertige Liste reinkopieren."
    },
    {
      sel: "#btnSpin",
      title: "Drehen",
      text: "Ein Druck, das Rad läuft aus — und wer getroffen wird, landet im nächsten freien Slot. Darunter verteilt „Alle auf einmal auslosen“ die ganze Crew in einem Rutsch."

      text: "Hier füllt sich der Abend. Zwei Zeilen nacheinander antippen tauscht sie, das × gibt einen Slot wieder frei. Ein grünes +1 markiert Mitternacht."
    },
    {
      sel: "#btnSettings",
      title: "Einstellungen",
      text: "Hinter dem orangen Balken stecken Startzeit, Länge pro Slot, Anzahl und Modus. Ich klappe ihn dir jetzt auf."
    },
    {
      sel: ".stepper",
      title: "Wie lang wird's",
      text: "Mit − und + legst du fest, wie viele Slots gespielt werden. Mehr Slots heißt: der Abend läuft über Mitternacht weiter — daneben steht immer, wann Schluss ist.",

          : "Laufplan fertig? Ein Druck, und er liegt als Text in der Zwischenablage — ab damit in die Gruppe.";
      }
    },
    {

      title: "Oben rechts",
      text: "Fragezeichen: dieser Rundgang. Sonne: heller Modus. Kreispfeil: alles zurücksetzen — mit Rückgängig, falls es ein Versehen war."
    }
  ];

  var SEED = ["Kalle", "Mira", "Nox", "Tobi", "Selin", "Jonas"];

  /* Kontakt in der Fusszeile - leer lassen, dann steht nur der Name da */
  var CONTACT_EMAIL = "david.plattenteller.dj@gmail.com";

  var state = {
    djs: SEED.slice(),
    slotCount: SEED.length,
    autoSlots: true,
    startTime: "18:00",
    slotMin: 60,
    once: true,
    assigned: new Array(SEED.length).fill(null),
    spinning: false,
    rotation: 0,
    winnerIndex: -1,
    freshSlot: -1
  };

  var el = {
    roster: document.getElementById("roster"),
    crewCount: document.getElementById("crewCount"),
    crewNote: document.getElementById("crewNote"),
    addForm: document.getElementById("addForm"),
    djName: document.getElementById("djName"),
    startTime: document.getElementById("startTime"),
    slotMin: document.getElementById("slotMin"),
    slotVal: document.getElementById("slotVal"),
    btnSettings: document.getElementById("btnSettings"),
    settings: document.getElementById("settings"),
    settingsSum: document.getElementById("settingsSum"),
    slotMinus: document.getElementById("slotMinus"),
    slotPlus: document.getElementById("slotPlus"),
    until: document.getElementById("until"),
    modeOnce: document.getElementById("modeOnce"),
    modeMulti: document.getElementById("modeMulti"),
    canvas: document.getElementById("wheel"),
    btnSpin: document.getElementById("btnSpin"),
    btnAll: document.getElementById("btnAll"),
    readout: document.getElementById("readout"),
    who: document.getElementById("who"),
    where: document.getElementById("where"),
    slots: document.getElementById("slots"),
    planCount: document.getElementById("planCount"),
    btnCopy: document.getElementById("btnCopy"),
    btnClearPlan: document.getElementById("btnClearPlan"),
    btnResetAll: document.getElementById("btnResetAll"),
    btnTheme: document.getElementById("btnTheme"),
    btnTour: document.getElementById("btnTour"),
    tour: document.getElementById("tour"),
    tourSpot: document.getElementById("tourSpot"),
    tourCard: document.getElementById("tourCard"),
    tourStep: document.getElementById("tourStep"),
    tourTitle: document.getElementById("tourTitle"),
    tourText: document.getElementById("tourText"),
    tourSkip: document.getElementById("tourSkip"),
    tourClose: document.getElementById("tourClose"),
    reveal: document.getElementById("reveal"),
    revealName: document.getElementById("revealName"),
    revealSlot: document.getElementById("revealSlot"),
    soundOff: document.getElementById("soundOff"),
    soundOn: document.getElementById("soundOn"),
    tourArrow: document.getElementById("tourArrow"),
    tourNext: document.getElementById("tourNext")
  };

  var tourIndex = -1;
  var tourTarget = null;
  var tourRaf = 0;

  var undoSnap = null;           /* Zustand vor der letzten Aktion */
  var swapFrom = -1;             /* angetippte Zeile beim Tauschen */
  var crewOpen = null;           /* null = automatisch je nach Groesse */
  var soundOn = false;
  var audioCtx = null;
  var lastTick = -1;
  var revealTimer = 0;
  var toastNode = null;
  var toastTimer = 0;
  var canShare = window.matchMedia("(hover: none)").matches && typeof navigator.share === "function";
  var settingsWereOpen = false;

  var ctx = el.canvas.getContext("2d");

  /* ---------- Zustand ---------- */

  function setState(patch) {
    state = Object.assign({}, state, patch);
    save();
    render();
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        djs: state.djs,
        slotCount: state.slotCount,
        autoSlots: state.autoSlots,
        startTime: state.startTime,
        slotMin: state.slotMin,
        once: state.once,
        assigned: state.assigned
      }));
    } catch (err) {
      /* Privates Fenster oder blockierter Speicher: laeuft ohne Merken weiter. */
    }
  }

  function load() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (err) {
      return;
    }
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.djs)) return;
      var count = clampSlots(data.slotCount);
      state = Object.assign({}, state, {
        djs: data.djs,
        slotCount: count,
        autoSlots: data.autoSlots !== false,
        startTime: typeof data.startTime === "string" ? data.startTime : state.startTime,
        slotMin: Number(data.slotMin) || state.slotMin,
        once: data.once !== false,
        assigned: fitPlan(Array.isArray(data.assigned) ? data.assigned : [], count)
      });
    } catch (err) {
      /* Kaputter Speicherstand wird ignoriert, Beispiel-Crew bleibt stehen. */
    }
  }

  function clampSlots(n) {
    var v = Math.round(Number(n));
    if (!isFinite(v) || v < 1) return 1;
    return Math.min(v, MAX_SLOTS);
  }

  function fitPlan(plan, count) {
    var next = new Array(count).fill(null);
    for (var i = 0; i < count && i < plan.length; i++) {
      next[i] = plan[i] || null;
    }
    return next;
  }

  /* ---------- Ableitungen ---------- */

  function pool() {
    if (!state.once) return state.djs.slice();
    var placed = state.assigned.filter(Boolean);
    return state.djs.filter(function (name) {
      var idx = placed.indexOf(name);
      if (idx === -1) return true;
      placed.splice(idx, 1);
      return false;
    });
  }

  function nextFreeSlot() {
    return state.assigned.indexOf(null);
  }

  function canSpin() {
    return !state.spinning && pool().length > 0 && nextFreeSlot() !== -1;
  }

  function startMinutes() {
    var parts = String(state.startTime || "18:00").split(":");
    return (Number(parts[0]) || 0) * 60 + (Number(parts[1]) || 0);
  }

  function endMinutes() {
    return startMinutes() + state.slotCount * state.slotMin;
  }

  function slotLabel(i) {
    var from = startMinutes() + i * state.slotMin;
    return clock(from) + "–" + clock(from + state.slotMin);
  }

  /* Wie viele Tage nach dem Start liegt dieser Zeitpunkt? */
  function dayOf(mins) {
    return Math.floor(mins / 1440);
  }

  function clock(mins) {
    var m = ((mins % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  }

  function segColor(i, n, ramp) {
    var idx = i % ramp.length;
    if (n > 1 && i === n - 1 && idx === 0) idx = 1;
    return ramp[idx];
  }

  /* ---------- Hell / dunkel ---------- */

  function currentTheme() {
    var stamp = document.documentElement.getAttribute("data-theme");
    if (stamp === "light" || stamp === "dark") return stamp;
    return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }

  function pal() {
    return PALETTE[currentTheme()];
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch (err) {
      /* ohne Speicher gilt die Wahl nur fuer diesen Besuch */
    }
    syncThemeButton();
    drawWheel();
  }

  function syncThemeButton() {
    var t = currentTheme();
    el.btnTheme.setAttribute("data-mode", t);
    el.btnTheme.title = t === "dark" ? "Auf hell umschalten" : "Auf dunkel umschalten";
  }

  /* ---------- Zufall ---------- */

  /* Echter Zufall aus dem Browser, gleichverteilt ohne Modulo-Schlagseite. */
  function randInt(n) {
    if (n <= 1) return 0;
    if (window.crypto && window.crypto.getRandomValues) {
      var limit = Math.floor(4294967296 / n) * n;
      var buf = new Uint32Array(1);
      do {
        window.crypto.getRandomValues(buf);
      } while (buf[0] >= limit);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function randUnit() {
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] / 4294967296;
    }
    return Math.random();
  }

  /* ---------- Rad ---------- */

  function sizeCanvas() {
    var rect = el.canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var px = Math.max(240, Math.round(rect.width * dpr));
    if (el.canvas.width !== px) {
      el.canvas.width = px;
      el.canvas.height = px;
    }
    drawWheel();
  }

  function drawWheel() {
    var size = el.canvas.width;
    var c = size / 2;
    var r = c - size * 0.02;
    var names = pool();
    var pl = pal();

    ctx.clearRect(0, 0, size, size);

    ctx.fillStyle = pl.base;
    ctx.beginPath();
    ctx.arc(c, c, r, 0, Math.PI * 2);
    ctx.fill();

    if (names.length === 0) {
      ctx.fillStyle = pl.quiet;
      ctx.font = "600 " + Math.round(size * 0.038) + "px 'IBM Plex Sans', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Keine Namen im Rad", c, c);
      ctx.strokeStyle = pl.ring;
      ctx.lineWidth = Math.max(2, size * 0.006);
      ctx.beginPath();
      ctx.arc(c, c, r - ctx.lineWidth, 0, Math.PI * 2);
      ctx.stroke();
      return;
    }

    var seg = (Math.PI * 2) / names.length;

    /* Bei vielen Namen wird die Schrift kleiner, damit sich nichts stapelt:
       sie darf nie hoeher sein als das Segment auf halber Strecke breit ist. */
    var fontPx = Math.max(
      Math.round(size * 0.016),
      Math.round(Math.min(size * 0.036, seg * r * 0.62 * 0.8))
    );
    var nameFont = "600 " + fontPx + "px 'IBM Plex Sans', sans-serif";

    for (var i = 0; i < names.length; i++) {
      var a0 = state.rotation + i * seg;
      var a1 = a0 + seg;
      var isWinner = !state.spinning && i === state.winnerIndex;
      var col = segColor(i, names.length, pl.ramp);

      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, a0, a1);
      ctx.closePath();
      ctx.fillStyle = isWinner ? pl.win.fill : col.fill;
      ctx.fill();
      ctx.strokeStyle = isWinner ? pl.accent : pl.seam;
      ctx.lineWidth = isWinner ? Math.max(2, size * 0.008) : Math.max(1, size * 0.002);
      ctx.stroke();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(a0 + seg / 2);
      ctx.fillStyle = isWinner ? pl.win.ink : col.ink;
      ctx.font = nameFont;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(fitText(names[i], r * 0.62), r * 0.88, 0);
      ctx.restore();
    }

    /* Nabe wie ein Plattenlabel - zeigt, um welchen Slot gerade gedreht wird */
    var hub = r * 0.235;
    var nextIdx = nextFreeSlot();
    var hubMain = nextIdx === -1 ? "voll" : clock(startMinutes() + nextIdx * state.slotMin);
    ctx.beginPath();
    ctx.arc(c, c, hub, 0, Math.PI * 2);
    ctx.fillStyle = pl.hubFill;
    ctx.fill();
    ctx.strokeStyle = pl.accent;
    ctx.lineWidth = Math.max(2, size * 0.005);
    ctx.stroke();

    ctx.fillStyle = pl.hubText;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "600 " + Math.round(size * 0.046) + "px 'IBM Plex Sans', sans-serif";
    ctx.fillText(hubMain, c, c - size * 0.012);
    ctx.fillStyle = pl.hubLabel;
    ctx.font = "500 " + Math.round(size * 0.02) + "px 'IBM Plex Sans', sans-serif";
    ctx.fillText(names.length + " IM RAD", c, c + size * 0.03);
  }

  function fitText(text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    var cut = text;
    while (cut.length > 1 && ctx.measureText(cut + "…").width > maxWidth) {
      cut = cut.slice(0, -1);
    }
    return cut + "…";
  }

  /* ---------- Drehen ---------- */

  function spin() {
    if (!canSpin()) return;

    var names = pool();
    var winner = randInt(names.length);
    var seg = (Math.PI * 2) / names.length;
    var turns = MIN_TURNS + randInt(MAX_TURNS - MIN_TURNS + 1);

    /* nicht exakt mittig stehenbleiben - sieht echter aus */
    var jitter = (randUnit() - 0.5) * seg * 0.7;
    var target = -Math.PI / 2 - (winner + 0.5) * seg + jitter;
    var from = state.rotation;
    var delta = ((target - from) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) + turns * Math.PI * 2;

    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var duration = reduced ? SPIN_MS_REDUCED : SPIN_MS;
    var t0 = performance.now();

    state = Object.assign({}, state, { spinning: true, winnerIndex: -1, freshSlot: -1 });
    swapFrom = -1;
    lastTick = -1;
    el.btnSpin.disabled = true;
    el.btnAll.disabled = true;
    el.readout.classList.remove("is-idle");
    el.who.textContent = "…";
    el.where.textContent = "Das Rad läuft";

    function frame(now) {
      var p = Math.min(1, (now - t0) / duration);
      var eased = 1 - Math.pow(1 - p, 4);
      state.rotation = from + delta * eased;

      /* welches Segment liegt gerade unter dem Zeiger? bei Wechsel: tick */
      var under = Math.floor(((((-Math.PI / 2 - state.rotation) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) / seg);
      if (under !== lastTick) {
        lastTick = under;
        tick();
      }

      drawWheel();
      if (p < 1) {
        requestAnimationFrame(frame);
        return;
      }
      finish(names[winner], winner);
    }
    requestAnimationFrame(frame);
  }

  /* Kurzer Klick aus dem Browser selbst - keine Datei, kein Download. */
  function tick() {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1500, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.12, t + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.05);
    } catch (err) {
      /* kein Ton moeglich - dann eben still */
    }
  }

  function setSound(on) {
    soundOn = on;
    try {
      localStorage.setItem(SOUND_KEY, on ? "1" : "0");
    } catch (err) {
      /* Wahl gilt dann nur fuer diesen Besuch */
    }
    renderControls();
    if (on) tick();
  }

  /* ---------- Rueckgaengig ---------- */

  function remember() {
    undoSnap = {
      djs: state.djs,
      assigned: state.assigned,
      slotCount: state.slotCount,
      autoSlots: state.autoSlots,
      once: state.once
    };
  }

  function offerUndo(msg) {
    var snap = undoSnap;
    if (!snap) return;
    toast(msg, function () {
      swapFrom = -1;
      setState(Object.assign({}, snap, { winnerIndex: -1, freshSlot: -1 }));
      toast("Rückgängig gemacht");
    });
  }

  /* ---------- Treffer-Moment ---------- */

  function showReveal(name, slot) {
    clearTimeout(revealTimer);
    el.revealName.textContent = name;
    el.revealSlot.textContent = "Slot " + (slot + 1) + " · " + slotLabel(slot);
    el.reveal.classList.remove("is-out");
    el.reveal.hidden = false;
    revealTimer = setTimeout(function () {
      el.reveal.classList.add("is-out");
      revealTimer = setTimeout(function () { el.reveal.hidden = true; }, 300);
    }, REVEAL_MS);
  }

  /* ---------- Slots tauschen / freigeben ---------- */

  function rowTap(i) {
    if (state.spinning) return;
    if (swapFrom === -1) {
      if (!state.assigned[i]) return;
      swapFrom = i;
      renderPlan();
      toast("Jetzt die Zeile antippen, mit der getauscht werden soll");
      return;
    }
    if (swapFrom === i) {
      swapFrom = -1;
      renderPlan();
      hideToast();
      return;
    }
    var plan = state.assigned.slice();
    var held = plan[swapFrom];
    plan[swapFrom] = plan[i];
    plan[i] = held;
    swapFrom = -1;
    remember();
    setState({ assigned: plan, winnerIndex: -1, freshSlot: i });
    offerUndo("Getauscht");
  }

  function releaseSlot(i) {
    if (state.spinning || !state.assigned[i]) return;
    swapFrom = -1;
    var plan = state.assigned.slice();
    plan[i] = null;
    remember();
    setState({ assigned: plan, winnerIndex: -1, freshSlot: -1 });
    offerUndo(clock(startMinutes() + i * state.slotMin) + " wieder frei");
  }

  /* Ganze Crew in einem Rutsch verteilen - dieselbe Ziehung wie am Rad,
     nur ohne siebenmal zuzuschauen. Belegte Slots bleiben unangetastet. */
  function drawAll() {
    if (state.spinning) return;

    var plan = state.assigned.slice();
    var rest = pool();
    var placed = 0;

    for (var i = 0; i < plan.length; i++) {
      if (plan[i]) continue;
      if (state.once) {
        if (rest.length === 0) break;
        plan[i] = rest.splice(randInt(rest.length), 1)[0];
      } else {
        if (state.djs.length === 0) break;
        plan[i] = state.djs[randInt(state.djs.length)];
      }
      placed++;
    }

    if (placed === 0) return;
    swapFrom = -1;
    remember();
    setState({ assigned: plan, winnerIndex: -1, freshSlot: -1 });
    offerUndo(placed === 1 ? "1 Slot ausgelost" : placed + " Slots ausgelost");
  }

  function finish(name, winnerIndex) {
    var slot = nextFreeSlot();
    remember();
    var plan = state.assigned.slice();
    plan[slot] = name;
    setState({ spinning: false, winnerIndex: winnerIndex, assigned: plan, freshSlot: slot });
    el.readout.classList.remove("is-idle");
    el.who.textContent = name;
    el.where.textContent = "Slot " + (slot + 1) + " · " + slotLabel(slot);
    showReveal(name, slot);
    setTimeout(function () {
      offerUndo(name + " → " + clock(startMinutes() + slot * state.slotMin));
    }, REVEAL_MS + 100);
  }

  /* ---------- Ausgabe ---------- */

  function render() {
    renderRoster();
    renderPlan();
    renderControls();
    drawWheel();
  }

  function isSeedCrew() {
    if (state.djs.length !== SEED.length) return false;
    return SEED.every(function (n) { return state.djs.indexOf(n) !== -1; });
  }

  function crewIsOpen() {
    if (crewOpen !== null) return crewOpen;
    return state.djs.length <= CREW_FOLD_AT;
  }

  function renderNote() {
    el.crewNote.innerHTML = "";
    el.crewNote.hidden = state.djs.length === 0;
    if (state.djs.length === 0) return;

    if (isSeedCrew()) {
      el.crewNote.appendChild(document.createTextNode("Beispielnamen zum Ausprobieren. "));
      var link = document.createElement("button");
      link.type = "button";
      link.textContent = "Beispiel-Crew entfernen";
      link.addEventListener("click", removeSeed);
      el.crewNote.appendChild(link);
    } else {
      el.crewNote.textContent = "Mehrere auf einmal: mit Komma trennen oder Liste reinkopieren.";
    }
  }

  function renderRoster() {
    el.roster.innerHTML = "";
    renderNote();

    var n = state.djs.length;
    var open = crewIsOpen();
    var label = n + (n === 1 ? " DJ" : " DJs");
    if (n > 0) label += open ? "  ▴" : "  ▾";
    el.crewCount.textContent = label;
    el.crewCount.setAttribute("aria-expanded", open ? "true" : "false");
    el.roster.hidden = n > 0 && !open;

    if (state.djs.length === 0) {
      var hint = document.createElement("p");
      hint.className = "empty";
      hint.textContent = "Noch niemand eingetragen.";
      el.roster.appendChild(hint);
      return;
    }

    var placed = state.assigned.filter(Boolean);
    state.djs.forEach(function (name, i) {
      var isPlaced = state.once && placed.indexOf(name) !== -1;
      if (isPlaced) placed.splice(placed.indexOf(name), 1);

      var chip = document.createElement("span");
      chip.className = isPlaced ? "chip is-placed" : "chip";
      chip.title = isPlaced ? name + " steht im Plan" : name;

      if (isPlaced) {
        var dot = document.createElement("span");
        dot.className = "dot";
        chip.appendChild(dot);
      }

      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = name;
      chip.appendChild(nm);

      var x = document.createElement("button");
      x.className = "x";
      x.type = "button";
      x.textContent = "×";
      x.setAttribute("aria-label", name + " entfernen");
      x.addEventListener("click", function () { removeDj(i); });
      chip.appendChild(x);

      el.roster.appendChild(chip);
    });
  }

  function renderPlan() {
    el.slots.innerHTML = "";
    var taken = state.assigned.filter(Boolean).length;
    el.planCount.textContent = state.startTime + "–" + clock(endMinutes()) + "  ·  " + taken + "/" + state.slotCount;
    var next = nextFreeSlot();
    var day = 0;
    var fresh = null;

    for (var i = 0; i < state.slotCount; i++) {
      var slotDay = dayOf(startMinutes() + i * state.slotMin);
      var newDay = slotDay > day;
      day = slotDay;

      var name = state.assigned[i];
      var li = document.createElement("li");
      var classes = [];
      if (!name) classes.push("is-open");
      if (name) classes.push("is-filled");
      if (i === next) classes.push("is-next");
      if (i === state.freshSlot) classes.push("is-fresh");
      if (i === swapFrom) classes.push("is-picked");
      li.className = classes.join(" ");
      li.addEventListener("click", rowTapHandler(i));
      if (i === state.freshSlot || (state.freshSlot === -1 && i === next)) {
        fresh = li;
      }

      var time = document.createElement("span");
      time.className = "time";
      time.textContent = clock(startMinutes() + i * state.slotMin);

      var dj = document.createElement("span");
      dj.className = "dj";
      dj.textContent = name ? name : (i === next ? "nächster" : "frei");

      li.appendChild(time);
      if (newDay) {
        var tag = document.createElement("span");
        tag.className = "daytag";
        tag.textContent = "+" + slotDay;
        tag.title = slotDay === 1 ? "ab hier nach Mitternacht" : "ab hier " + slotDay + " Tage nach dem Start";
        li.appendChild(tag);
      }
      li.appendChild(dj);
      if (name) {
        var rel = document.createElement("button");
        rel.className = "rel";
        rel.type = "button";
        rel.textContent = "×";
        rel.setAttribute("aria-label", name + " aus diesem Slot nehmen");
        rel.addEventListener("click", releaseHandler(i));
        li.appendChild(rel);
      }
      el.slots.appendChild(li);
    }

    if (fresh && fresh.scrollIntoView) {
      fresh.scrollIntoView({ block: "nearest" });
    }
  }

  function rowTapHandler(i) {
    return function () { rowTap(i); };
  }

  function releaseHandler(i) {
    return function (e) {
      e.stopPropagation();
      releaseSlot(i);
    };
  }

  function slotsWord(n) {
    return n + (n === 1 ? " Slot" : " Slots");
  }

  function renderControls() {
    el.startTime.value = state.startTime;
    el.slotMin.value = String(state.slotMin);
    el.slotVal.textContent = String(state.slotCount);
    var endDay = dayOf(endMinutes() - 1);
    var overnight = endDay > 0 ? " (+" + endDay + ")" : "";
    el.until.textContent = "bis " + clock(endMinutes()) + overnight;
    el.settingsSum.textContent =
      state.startTime + "–" + clock(endMinutes()) + overnight +
      "  ·  " + state.slotMin + " Min  ·  " + slotsWord(state.slotCount) + "  ·  " +
      (state.once ? "Jeder 1×" : "Mehrfach");
    el.slotMinus.disabled = state.slotCount <= 1;
    el.slotPlus.disabled = state.slotCount >= MAX_SLOTS;
    el.modeOnce.setAttribute("aria-pressed", state.once ? "true" : "false");
    el.modeMulti.setAttribute("aria-pressed", state.once ? "false" : "true");
    el.soundOff.setAttribute("aria-pressed", soundOn ? "false" : "true");
    el.soundOn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    el.btnCopy.textContent = canShare ? "Teilen" : "Kopieren";

    el.btnSpin.disabled = !canSpin();
    el.btnAll.disabled = !canSpin();
    if (state.spinning) return;

    if (state.djs.length === 0) {
      idle("Bereit", "Trag erst ein paar Namen ein");
    } else if (nextFreeSlot() === -1) {
      idle("Plan voll", state.slotCount === 1 ? "Der Slot ist vergeben" : "Alle " + state.slotCount + " Slots sind vergeben");
    } else if (pool().length === 0) {
      idle("Rad leer", "Jeder war dran — Modus auf „Mehrfach“ oder Plan leeren");
    } else if (state.winnerIndex === -1) {
      idle("Bereit", "Dreh das Rad für Slot " + (nextFreeSlot() + 1));
    }
  }

  function idle(head, sub) {
    el.readout.classList.add("is-idle");
    el.who.textContent = head;
    el.where.textContent = sub;
  }

  /* ---------- Aktionen ---------- */

  /* Ein Name oder gleich eine ganze Liste: "Kalle, Mira; Nox" oder mehrzeilig eingefuegt. */
  function addDj(input) {
    var djs = state.djs.slice();
    var added = 0;
    var dupes = 0;

    String(input).split(/[,;\n\t]+/).forEach(function (raw) {
      var clean = raw.trim().replace(/\s+/g, " ").slice(0, 28);
      if (!clean) return;
      var exists = djs.some(function (n) {
        return n.toLowerCase() === clean.toLowerCase();
      });
      if (exists) {
        dupes++;
        return;
      }
      djs.push(clean);
      added++;
    });

    if (added === 0) {
      if (dupes > 0) toast(dupes === 1 ? "Steht schon drin" : "Stehen schon drin");
      return;
    }
    if (dupes > 0) toast(dupes + (dupes === 1 ? " Name war schon drin" : " Namen waren schon drin"));

    var patch = { djs: djs, winnerIndex: -1, freshSlot: -1 };
    if (state.autoSlots) {
      patch.slotCount = clampSlots(djs.length);
      patch.assigned = fitPlan(state.assigned, patch.slotCount);
    }
    setState(patch);
  }

  function removeDj(index) {
    var name = state.djs[index];
    var djs = state.djs.filter(function (_, i) { return i !== index; });
    var assigned = state.assigned.map(function (n) { return n === name ? null : n; });
    var patch = { djs: djs, assigned: assigned, winnerIndex: -1, freshSlot: -1 };
    if (state.autoSlots) {
      patch.slotCount = clampSlots(Math.max(1, djs.length));
      patch.assigned = fitPlan(assigned, patch.slotCount);
    }
    swapFrom = -1;
    remember();
    setState(patch);
    offerUndo(name + " entfernt");
  }

  function resetAll(msg) {
    swapFrom = -1;
    crewOpen = null;
    remember();
    setState({ djs: [], slotCount: 1, autoSlots: true, assigned: [null], winnerIndex: -1, freshSlot: -1 });
    offerUndo(msg);
    if (window.matchMedia("(hover: hover)").matches) el.djName.focus();
  }

  function removeSeed() {
    resetAll("Beispiel-Crew entfernt");
  }

  function stepSlots(delta) {
    var count = clampSlots(state.slotCount + delta);
    setState({ slotCount: count, autoSlots: false, assigned: fitPlan(state.assigned, count) });
  }

  function planText() {
    var lines = ["Laufplan – ab " + state.startTime + " Uhr, " + state.slotMin + " Min pro Slot", ""];
    var day = 0;
    for (var i = 0; i < state.slotCount; i++) {
      var slotDay = dayOf(startMinutes() + i * state.slotMin);
      while (slotDay > day) {
        day++;
        lines.push(day === 1 ? "--- Mitternacht ---" : "--- Tag " + (day + 1) + " ---");
      }
      lines.push(slotLabel(i) + "  " + (state.assigned[i] || "— frei —"));
    }
    return lines.join("\n");
  }

  function openSettings(open) {
    el.settings.hidden = !open;
    el.btnSettings.setAttribute("aria-expanded", open ? "true" : "false");
    sizeCanvas();
  }

  /* ---------- Rundgang ---------- */

  function startTour() {
    settingsWereOpen = !el.settings.hidden;
    tourIndex = -1;
    el.tour.hidden = false;
    stepTour();
    if (!tourRaf) tourRaf = requestAnimationFrame(trackTour);
  }

  function stepTour() {
    if (el.tour.hidden) return;   /* Doppelklick auf "Fertig" startet sonst neu */
    tourIndex++;
    if (tourIndex >= TOUR.length) {
      endTour();
      return;
    }

    var step = TOUR[tourIndex];
    if (step.before) step.before();

    var target = document.querySelector(step.sel);
    if (!target) {
      stepTour();
      return;
    }

    el.tourStep.textContent = "Schritt " + (tourIndex + 1) + " von " + TOUR.length;
    el.tourTitle.textContent = step.title;
    el.tourText.textContent = typeof step.text === "function" ? step.text() : step.text;
    el.tourNext.textContent = tourIndex === TOUR.length - 1 ? "Fertig" : "Weiter";

    tourTarget = target;

    var box = target.getBoundingClientRect();
    if (box.top < 8 || box.bottom > window.innerHeight - 8) {
      target.scrollIntoView({ block: "center", inline: "nearest" });
    }
    placeTour(target);
  }

  /* Nur schreiben, wenn sich wirklich etwas aendert - sonst rechnet der
     Browser bei jedem Bild neu. */
  function put(node, prop, value) {
    if (node.style[prop] !== value) node.style[prop] = value;
  }

  /* Loch ueber das echte Bedienelement, Karte mit Zeiger daneben. */
  function placeTour(target) {
    var r = target.getBoundingClientRect();
    var pad = 6;
    put(el.tourSpot, "left", Math.max(0, r.left - pad) + "px");
    put(el.tourSpot, "top", Math.max(0, r.top - pad) + "px");
    put(el.tourSpot, "width", (r.width + pad * 2) + "px");
    put(el.tourSpot, "height", (r.height + pad * 2) + "px");

    var cw = el.tourCard.offsetWidth;
    var ch = el.tourCard.offsetHeight;
    var gap = 14;
    var top;
    var side = "";

    if (window.innerHeight - r.bottom > ch + gap + 8) {
      top = r.bottom + gap;
      side = "up";
    } else if (r.top > ch + gap + 8) {
      top = r.top - ch - gap;
      side = "down";
    } else {
      top = Math.max(8, (window.innerHeight - ch) / 2);
    }

    var left = r.left + r.width / 2 - cw / 2;
    left = Math.min(Math.max(10, left), window.innerWidth - cw - 10);

    put(el.tourCard, "top", Math.round(top) + "px");
    put(el.tourCard, "left", Math.round(left) + "px");

    /* Zeiger sitzt ueber der Mitte des markierten Elements */
    if (side) {
      var arrowX = Math.min(Math.max(16, r.left + r.width / 2 - left), cw - 16);
      put(el.tourArrow, "left", Math.round(arrowX) + "px");
      el.tourArrow.className = "tour-arrow " + side;
      el.tourArrow.hidden = false;
    } else {
      el.tourArrow.hidden = true;
    }
  }

  /* Solange der Rundgang laeuft, jede Bildwiederholung nachfuehren. Damit sitzt
     die Markierung auch dann richtig, wenn das Handy noch nachscrollt oder die
     Adressleiste ein- und ausfaehrt. */
  function trackTour() {
    if (el.tour.hidden) {
      tourRaf = 0;
      return;
    }
    if (tourTarget) placeTour(tourTarget);
    tourRaf = requestAnimationFrame(trackTour);
  }

  function endTour() {
    el.tour.hidden = true;
    tourIndex = -1;
    tourTarget = null;
    if (tourRaf) {
      cancelAnimationFrame(tourRaf);
      tourRaf = 0;
    }
    if (!settingsWereOpen) openSettings(false);
    try {
      localStorage.setItem(TOUR_KEY, "1");
    } catch (err) {
      /* ohne Speicher startet der Rundgang beim naechsten Besuch erneut */
    }
  }

  function hideToast() {
    clearTimeout(toastTimer);
    if (toastNode) {
      toastNode.remove();
      toastNode = null;
    }
  }

  /* Eine Meldung unten; mit action gibt es einen Rueckgaengig-Knopf dazu. */
  function toast(msg, action) {
    hideToast();
    var box = document.createElement("div");
    box.className = "toast";
    var text = document.createElement("span");
    text.textContent = msg;
    box.appendChild(text);
    if (action) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Rückgängig";
      btn.addEventListener("click", function () {
        hideToast();
        action();
      });
      box.appendChild(btn);
    }
    document.body.appendChild(box);
    toastNode = box;
    toastTimer = setTimeout(hideToast, action ? 5000 : 2600);
  }

  /* ---------- Verdrahtung ---------- */

  el.addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    addDj(el.djName.value);
    el.djName.value = "";
    el.djName.focus();
  });

  el.btnSpin.addEventListener("click", spin);
  el.btnAll.addEventListener("click", drawAll);

  el.startTime.addEventListener("change", function () {
    setState({ startTime: el.startTime.value || "18:00" });
  });

  el.slotMin.addEventListener("change", function () {
    setState({ slotMin: Number(el.slotMin.value) || 60 });
  });

  el.slotMinus.addEventListener("click", function () { stepSlots(-1); });
  el.slotPlus.addEventListener("click", function () { stepSlots(1); });

  el.modeOnce.addEventListener("click", function () { setState({ once: true, winnerIndex: -1 }); });
  el.modeMulti.addEventListener("click", function () { setState({ once: false, winnerIndex: -1 }); });

  el.btnClearPlan.addEventListener("click", function () {
    if (!state.assigned.some(Boolean)) return;
    swapFrom = -1;
    remember();
    setState({ assigned: new Array(state.slotCount).fill(null), winnerIndex: -1, freshSlot: -1 });
    offerUndo("Plan geleert");
  });

  el.btnResetAll.addEventListener("click", function () {
    if (state.djs.length === 0 && !state.assigned.some(Boolean)) return;
    resetAll("Alles zurückgesetzt");
  });

  el.crewCount.addEventListener("click", function () {
    if (state.djs.length === 0) return;
    crewOpen = !crewIsOpen();
    renderRoster();
  });

  el.soundOff.addEventListener("click", function () { setSound(false); });
  el.soundOn.addEventListener("click", function () { setSound(true); });

  el.btnCopy.addEventListener("click", function () {
    var text = planText();
    if (canShare) {
      navigator.share({ text: text }).catch(function () {
        /* abgebrochen - nichts zu tun */
      });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast("Laufplan kopiert");
      }).catch(function () {
        toast("Kopieren hat nicht geklappt");
      });
    } else {
      toast("Kopieren geht in diesem Browser nicht");
    }
  });

  el.btnSettings.addEventListener("click", function () {
    openSettings(el.settings.hidden);
  });

  el.btnTheme.addEventListener("click", function () {
    applyTheme(currentTheme() === "dark" ? "light" : "dark");
  });

  el.btnTour.addEventListener("click", startTour);
  el.tourNext.addEventListener("click", stepTour);
  el.tourSkip.addEventListener("click", endTour);
  el.tourClose.addEventListener("click", endTour);

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!el.tour.hidden) endTour();
    if (swapFrom !== -1) {
      swapFrom = -1;
      renderPlan();
      hideToast();
    }
  });

  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
    if (!document.documentElement.hasAttribute("data-theme")) {
      syncThemeButton();
      drawWheel();
    }
  });

  window.addEventListener("resize", sizeCanvas);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawWheel);
  }

  var storedTheme = null;
  try {
    storedTheme = localStorage.getItem(THEME_KEY);
  } catch (err) {
    storedTheme = null;
  }
  if (storedTheme === "light" || storedTheme === "dark") {
    document.documentElement.setAttribute("data-theme", storedTheme);
  }
  syncThemeButton();

  if (CONTACT_EMAIL) {
    var foot = document.getElementById("footContact");
    foot.appendChild(document.createTextNode(" · "));
    var mail = document.createElement("a");
    mail.href = "mailto:" + CONTACT_EMAIL;
    mail.textContent = CONTACT_EMAIL;
    foot.appendChild(mail);
  }

  try {
    soundOn = localStorage.getItem(SOUND_KEY) === "1";
  } catch (err) {
    soundOn = false;
  }

  load();
  render();
  sizeCanvas();

  var tourSeen = null;
  try {
    tourSeen = localStorage.getItem(TOUR_KEY);
  } catch (err) {
    tourSeen = null;
  }
  if (!tourSeen) {
    setTimeout(startTour, 700);
  }
})();
</script>

</body>
</html>
